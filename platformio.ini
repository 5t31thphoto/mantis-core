; ============================================================
;  MantisCore — BasaltSoftworks — M5Stack Core2
;  App home screen + SD installer for Mantis merged binaries.
; ============================================================
[platformio]
default_envs = mantiscore

[env:mantiscore]
; pioarduino + the "keyboot" Arduino libs build. Its bootloader starts MantisCore (app0, test
; partition) on power-on/reset and the selected app on a software reboot (option B).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
platform_packages = framework-arduinoespressif32-libs @ https://github.com/bmorcelli/myLibBuilder/releases/download/builds/launcher_keyboot_esp32-arduino-libs-20260910-173758.tar.gz
board = m5stack-core2
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = partitions.csv
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio
; same flash/PSRAM variant (dio, quad PSRAM) as Launcher's Core2 build
board_build.arduino.memory_type = dio_qspi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.offset_address = 0x10000
extra_scripts =
    enable_lto.py
    post:merge_bin.py
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -mfix-esp32-psram-cache-strategy=memw
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DMANTISCORE_VERSION='"1.0.0"'
    -DCORE_DEBUG_LEVEL=0
    ; size flags (as Launcher): the app must fit the 1.5 MB app0 slot
    -flto
    -ffunction-sections
    -fdata-sections
    -fno-common
    -Os
    -Wl,--gc-sections
    -Wl,--print-memory-usage
lib_deps =
    m5stack/M5Unified @ ^0.2.17
    bblanchon/ArduinoJson @ ^7.0.0
