# MantisCore - Build & Pages
#
# Ships as github/workflows/ (no dot) so the zip unpacks cleanly. Rename the
# folder to .github/workflows/ and commit to enable it - same as Pinball/Planet.
#
# Zip-drop: put a payload .zip in the repo root and push. This job unpacks it
# over the repo, deletes the zip, commits that, then builds and deploys the
# web flasher (website/) to GitHub Pages with the merged binary.
name: Build & Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PIO_ENV: mantiscore

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Unzip payload into repo, consume zip, commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mapfile -t ZIPS < <(find . -maxdepth 1 -type f -name '*.zip' | sort)
          if [ ${#ZIPS[@]} -eq 0 ]; then
            echo "No root zip - building tree as-is"
          else
            for z in "${ZIPS[@]}"; do
              echo "EXTRACT $z"
              TMP=$(mktemp -d)
              unzip -o "$z" -d "$TMP"
              NDIR=$(find "$TMP" -mindepth 1 -maxdepth 1 -type d | wc -l)
              NFILE=$(find "$TMP" -mindepth 1 -maxdepth 1 -type f | wc -l)
              TOP=$(find "$TMP" -mindepth 1 -maxdepth 1 -type d | head -1 || true)
              if [ "$NDIR" -eq 1 ] && [ "$NFILE" -eq 0 ] && [ -n "$TOP" ]; then SRCDIR="$TOP"; else SRCDIR="$TMP"; fi
              # The Actions token may not push workflow files, so a payload's
              # workflow folders are left out (rename + commit those by hand).
              for wf in github .github; do
                if [ -d "$SRCDIR/$wf" ]; then echo "SKIP $wf/ (update workflows manually)"; rm -rf "$SRCDIR/$wf"; fi
              done
              # the payload's src/ replaces the repo's src/ entirely, so removed files don't linger
              if [ -d "$SRCDIR/src" ]; then rm -rf src; fi
              cp -a "$SRCDIR"/. .
              rm -rf "$TMP"
              rm -f "$z"
            done
            git add -A
            if ! git diff --staged --quiet; then
              git commit -m "ci: extract payload into repo (consume zip) [skip ci]"
              git push origin HEAD:${{ github.ref_name }}
            fi
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio esptool pillow

      - name: Build firmware
        # Retries only on transient package-download errors.
        run: |
          for attempt in 1 2 3; do
            set +e
            pio run -e "$PIO_ENV" 2>&1 | tee /tmp/build.log
            status=${PIPESTATUS[0]}
            set -e
            [ "$status" -eq 0 ] && break
            if ! grep -Eiq "(unrecognized status code '5[0-9][0-9]'|RemoteDisconnected|ConnectionError|Read timed out|ConnectTimeout|name resolution|package-manager-ioerror)" /tmp/build.log; then exit "$status"; fi
            [ "$attempt" -eq 3 ] && exit "$status"
            sleep $((attempt * 30))
          done
          ls -la mantiscore-merged.bin

      - name: Stage website
        env:
          BUILD_VERSION: "1.${{ github.run_number }}"
        run: |
          set -euo pipefail
          mkdir -p website/firmware
          cp -f mantiscore-merged.bin website/firmware/mantiscore-merged.bin
          cat > website/firmware/manifest.json << MAN
          {
            "name": "MantisCore",
            "version": "$BUILD_VERSION",
            "new_install_prompt_erase": true,
            "builds": [
              { "chipFamily": "ESP32", "parts": [ { "path": "mantiscore-merged.bin", "offset": 0 } ] }
            ]
          }
          MAN
          (cd sd_card && zip -qr ../website/firmware/mantiscore-sd-card.zip .)
          sed -i "s/__VERSION__/$BUILD_VERSION/g" website/index.html
          touch website/.nojekyll
          ls -la website/firmware/

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: mantiscore-firmware
          path: website/firmware/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
